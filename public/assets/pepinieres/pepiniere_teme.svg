<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="temeSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="temeSoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="280" fill="url(#temeSky)"/>
  <circle cx="200" cy="70" r="45" fill="#fde047" opacity="0.95"/>

  <!-- Soil -->
  <rect y="280" width="800" height="220" fill="url(#temeSoil)"/>

  <!-- Fruit Trees in agroforestry layout -->
  <!-- Mango Tree 1 -->
  <rect x="120" y="240" width="24" height="110" fill="#713f12" rx="4"/>
  <ellipse cx="132" cy="180" rx="70" ry="75" fill="#15803d"/>
  <!-- Mangos hanging -->
  <circle cx="110" cy="190" r="7" fill="#f59e0b"/>
  <circle cx="150" cy="210" r="7" fill="#f59e0b"/>
  <circle cx="135" cy="160" r="6" fill="#fbbf24"/>

  <!-- Mango Tree 2 -->
  <rect x="290" y="220" width="22" height="120" fill="#713f12" rx="4"/>
  <ellipse cx="301" cy="160" rx="65" ry="70" fill="#166534"/>
  <circle cx="280" cy="170" r="6" fill="#f59e0b"/>
  <circle cx="320" cy="180" r="7" fill="#eab308"/>

  <!-- Drip irrigation pipe network -->
  <line x1="50" y1="380" x2="750" y2="380" stroke="#0284c7" stroke-width="6"/>
  <line x1="50" y1="420" x2="750" y2="420" stroke="#0284c7" stroke-width="6"/>
  <line x1="50" y1="460" x2="750" y2="460" stroke="#0284c7" stroke-width="6"/>

  <!-- Rows of potted citrus plants with drip nozzles -->
  <g transform="translate(420, 260)">
    <!-- Water tank -->
    <rect x="250" y="10" width="70" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="262" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">EAU</text>
    <!-- Seedlings -->
    <rect x="10" y="90" width="20" height="24" rx="2" fill="#0f172a"/>
    <circle cx="20" cy="80" r="14" fill="#22c55e"/>
    <rect x="45" y="90" width="20" height="24" rx="2" fill="#0f172a"/>
    <circle cx="55" cy="80" r="14" fill="#22c55e"/>
    <rect x="80" y="90" width="20" height="24" rx="2" fill="#0f172a"/>
    <circle cx="90" cy="80" r="14" fill="#22c55e"/>
    <rect x="115" y="90" width="20" height="24" rx="2" fill="#0f172a"/>
    <circle cx="125" cy="80" r="14" fill="#22c55e"/>
    <rect x="150" y="90" width="20" height="24" rx="2" fill="#0f172a"/>
    <circle cx="160" cy="80" r="14" fill="#22c55e"/>
    <rect x="185" y="90" width="20" height="24" rx="2" fill="#0f172a"/>
    <circle cx="195" cy="80" r="14" fill="#22c55e"/>
  </g>

  <!-- Info Badge -->
  <rect x="20" y="20" width="340" height="75" rx="12" fill="#0f172a" fill-opacity="0.88" stroke="#f59e0b" stroke-width="2"/>
  <text x="35" y="45" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">PÉPINIÈRE TEME (PRIVÉE)</text>
  <text x="35" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#fbbf24">Bohicon • Spécialité : Fruitiers greffés &amp; Bois</text>
  <text x="35" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Capacité : 45 000 plants/an | Goutte-à-goutte</text>
</svg>
