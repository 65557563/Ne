  <!-- Big Tropical Trees on Right -->
  <path d="M570 340 L570 200 L560 200 L575 140 L590 200 L580 200 L580 340 Z" fill="#78350f"/>
  <circle cx="575" cy="130" r="55" fill="url(#greenFoliage)"/>
  <circle cx="545" cy="150" r="45" fill="#15803d"/>
  <circle cx="610" cy="145" r="45" fill="#166534"/>

  <path d="M680 360 L680 180 L670 180 L685 110 L700 180 L690 180 L690 360 Z" fill="#78350f"/>
