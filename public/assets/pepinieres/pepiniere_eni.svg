    <path d="M326 20 C326 5, 317 0, 315 10 C320 2, 326 10, 326 20 Z" fill="#22c55e"/>
    <path d="M326 20 C326 5, 335 0, 337 10 C332 2, 326 10, 326 20 Z" fill="#16a34a"/>
