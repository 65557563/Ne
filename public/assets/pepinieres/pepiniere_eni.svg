  <circle cx="725" cy="120" r="50" fill="#14532d"/>

  <!-- Info Overlay Tag -->
  <rect x="20" y="20" width="320" height="75" rx="12" fill="#0f172a" fill-opacity="0.88" stroke="#10b981" stroke-width="2"/>
  <text x="35" y="45" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">PÉPINIÈRE DE L'ENI</text>
  <text x="35" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#34d399">Commune d'Abomey • Arrondissement Vidolè</text>
  <text x="35" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Capacité : 25 000 plants/an | École Normale</text>
