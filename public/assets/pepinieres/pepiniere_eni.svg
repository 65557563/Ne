    <path d="M291 20 C291 5, 282 0, 280 10 C285 2, 291 10, 291 20 Z" fill="#22c55e"/>
    <path d="M291 20 C291 5, 300 0, 302 10 C297 2, 291 10, 291 20 Z" fill="#16a34a"/>

