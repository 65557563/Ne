<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="25%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="greenFoliage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="300" fill="url(#skyGrad)"/>
  <!-- Sun -->
  <circle cx="680" cy="80" r="50" fill="#fef08a" opacity="0.9"/>
  <!-- Clouds -->
  <path d="M120 100 q30 -30 60 0 q30 -20 60 0 q20 20 0 30 h-120 z" fill="#ffffff" opacity="0.75"/>
  <path d="M420 80 q25 -25 50 0 q25 -15 50 0 q15 15 0 25 h-100 z" fill="#ffffff" opacity="0.6"/>

  <!-- Background hills -->
  <path d="M0 300 Q200 240 400 290 T800 260 L800 350 L0 350 Z" fill="#166534" opacity="0.7"/>

  <!-- Ground / Soil Beds -->
  <rect y="290" width="800" height="210" fill="url(#groundGrad)"/>

  <!-- Nursery Greenhouse / Shade Cloth Structure -->
  <path d="M40 220 L240 180 L440 220 L440 340 L40 340 Z" fill="#047857" opacity="0.25" stroke="#065f46" stroke-width="3"/>
  <line x1="40" y1="220" x2="40" y2="340" stroke="#047857" stroke-width="4"/>
  <line x1="240" y1="180" x2="240" y2="340" stroke="#047857" stroke-width="4"/>
  <line x1="440" y1="220" x2="440" y2="340" stroke="#047857" stroke-width="4"/>
  <!-- Mesh lines on shade net -->
  <line x1="40" y1="245" x2="440" y2="245" stroke="#10b981" stroke-width="1" stroke-dasharray="4"/>
  <line x1="40" y1="270" x2="440" y2="270" stroke="#10b981" stroke-width="1" stroke-dasharray="4"/>
  <line x1="40" y1="295" x2="440" y2="295" stroke="#10b981" stroke-width="1" stroke-dasharray="4"/>

